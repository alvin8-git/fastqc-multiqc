name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip3 install -r requirements.txt

      - name: Run pylint
        run: |
          pylint run_fastqc_multiqc.py || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t alvin8/fastqc-multiqc:test .

      - name: Test Docker image
        run: |
          docker run --rm alvin8/fastqc-multiqc:test --help
